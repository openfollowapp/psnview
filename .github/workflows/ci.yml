name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch: # manual run, e.g. to test the signed macOS build

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pipx install poetry
      - run: poetry install --only dev --no-root
      - run: poetry run ruff check .
      - run: poetry run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Qt runtime libraries for the offscreen platform plugin
      - run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3
      - run: pipx install poetry
      - run: poetry install
      - run: poetry run pytest -v
        env:
          QT_QPA_PLATFORM: offscreen

  build-dmg:
    # Build, sign and notarize the .app + DMG on v* tags (attached to the
    # GitHub Release by the `release` job) and on manual runs. Signing needs
    # the APPLE_* repository secrets (see README); without them the build is
    # unsigned.
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    env:
      # `secrets` cannot be referenced in a step `if:`, so hoist presence checks.
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERT_P12 != '' }}
      HAS_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pipx install poetry
      - run: poetry install
      - name: Import Developer ID certificate into a temporary keychain
        if: env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }} # base64-encoded .p12
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -hex 16)"
          CERT="$RUNNER_TEMP/cert.p12"
          echo -n "$APPLE_CERT_P12" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          # Apple's Developer ID intermediate CA; without it the identity is reported as invalid.
          curl -sSfo "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN"
          security import "$CERT" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          rm -f "$CERT"
          # Sign by the identity's SHA-1 hash: unambiguous and contains no spaces.
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/ {print $2; exit}')"
          if [[ -z "$IDENTITY" ]]; then
            echo "No valid 'Developer ID Application' identity in the imported certificate:"
            security find-identity -v -p codesigning "$KEYCHAIN"
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
      - name: Prepare notarization credentials
        if: env.HAS_APPLE_CERT == 'true' && env.HAS_NOTARY_KEY == 'true'
        env:
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }} # contents of the .p8 file
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          printf '%s\n' "$APPLE_NOTARY_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_NOTARY_KEY_FILE=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          echo "APPLE_NOTARY_KEY_ID=$APPLE_NOTARY_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_NOTARY_ISSUER=$APPLE_NOTARY_ISSUER" >> "$GITHUB_ENV"
      - name: Build DMG
        run: bash packaging/build-dmg.sh
      - name: Smoke test
        run: |
          ./dist/PSNView.app/Contents/MacOS/PSNView & pid=$!
          sleep 15
          if ! kill -0 "$pid" 2>/dev/null; then wait "$pid"; echo "PSNView exited early ($?)"; exit 1; fi
          kill "$pid"; echo "OK: PSNView still running after 15s"
      - uses: actions/upload-artifact@v4
        with:
          name: PSNView-macos
          path: dist/PSNView-*.dmg
      - name: Remove signing keychain and API key
        if: always()
        run: |
          if [[ -n "${SIGNING_KEYCHAIN:-}" ]]; then security delete-keychain "$SIGNING_KEYCHAIN"; fi
          rm -f "$RUNNER_TEMP/AuthKey.p8"

  build-archive:
    # Single-file Windows (.exe) and Linux (.tar.gz) builds. Linux builds on
    # the oldest supported Ubuntu so the binary runs on older glibc.
    needs: [lint, test]
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: ubuntu-22.04
            label: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Qt runtime libraries so PyInstaller's PySide6 hooks can load Qt, plus
      # the xcb helper libraries the X11 platform plugin links against. Anything
      # missing here is left out of the binary and Qt then aborts at startup on
      # machines that lack it (libxcb-cursor0 is absent on many distros).
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1
      - run: pipx install poetry
      - run: poetry install
      - name: Build archive
        run: poetry run python packaging/build-archive.py
      - name: Smoke test (minimal container without Qt helper libs)
        if: runner.os == 'Linux'
        run: bash packaging/smoke-test-linux.sh dist/PSNView-*.tar.gz
      - name: Smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-Item dist/PSNView-*.exe
          $p = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) { Write-Error "PSNView exited early with code $($p.ExitCode)"; exit 1 }
          Stop-Process -Id $p.Id -Force
          Write-Host "OK: PSNView still running after 25s"
      - uses: actions/upload-artifact@v4
        with:
          name: PSNView-${{ matrix.label }}
          path: |
            dist/PSNView-*.exe
            dist/PSNView-*.tar.gz

  release:
    # Attach all platform builds to a GitHub Release when a v* tag is pushed.
    needs: [build-dmg, build-archive]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload assets
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: PSNView-*
          merge-multiple: true
          path: dist
      - run: ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PSNView-*.dmg
            dist/PSNView-*.exe
            dist/PSNView-*.tar.gz
